name: skillatlas
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: skillatlas_admin
      POSTGRES_DB: skillatlas
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillatlas_admin -d skillatlas"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: ../server
    user: "${LOCAL_UID}:${LOCAL_GID}"
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?}
      LISTEN_ADDR: ":8080"
      TLS_TERMINATED_BY_PROXY: "true"
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/skillatlas", "-healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  lan-proxy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    environment:
      LAN_HOST: ${LAN_HOST:-localhost}
      LAN_SITE_FILE: ${LAN_SITE_FILE:-Caddyfile.lan-disabled}
    ports:
      - "127.0.0.1:${API_PORT:-8447}:8447"
      - "0.0.0.0:${LAN_PORT:-8448}:8448"
      - "0.0.0.0:${CA_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.lan:/etc/caddy/Caddyfile.lan:ro
      - ./Caddyfile.lan-disabled:/etc/caddy/Caddyfile.lan-disabled:ro
      - ../.runtime/lan/public:/public:ro
      - lan-ca:/data
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres-data:
    name: skillatlas-postgres-v1
  lan-ca:
    name: skillatlas-lan-ca-v1
