name: skillatlas
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: skillatlas_admin
      POSTGRES_DB: skillatlas
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillatlas_admin -d skillatlas"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: ../server
    user: "${LOCAL_UID}:${LOCAL_GID}"
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?}
      LISTEN_ADDR: ":8447"
      TLS_CERT: /tls/cert.pem
      TLS_KEY: /tls/key.pem
    ports:
      - "127.0.0.1:${API_PORT:-8447}:8447"
    volumes:
      - ../.runtime/tls:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/skillatlas", "-healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
    name: skillatlas-postgres-v1
